name: Wearable trace checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<10' .
      - run: python -m pytest -q tests/test_wearable_audit.py tests/test_wearable_fixtures.py
      - run: swan-audit examples/wearable-safe.json --format sarif --output /tmp/swan-safe.sarif
      - name: Verify policy violations fail CI
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          for path in sorted(Path('fixtures/wearables').glob('*.json')):
              case = json.loads(path.read_text())
              trace = Path('/tmp/swan-ci-trace.json')
              trace.write_text(json.dumps(case['trace']))
              run = subprocess.run(['swan-audit', str(trace)], capture_output=True)
              if run.returncode not in (0, 1):
                  raise SystemExit('Invalid fixture CLI execution')
              report = json.loads(run.stdout)
              expected = 1 if report['summary']['errors'] else 0
              if run.returncode != expected:
                  raise SystemExit('Incorrect CLI exit status')
          PY
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[review,test]"
      - run: python -m pytest -q tests/test_wearable_api.py tests/test_wearable_server.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check review screen and downloads
        shell: bash
        run: |
          python -m uvicorn app.wearable_server:app --host 127.0.0.1 --port 18766 --no-access-log > /tmp/swan-web.log 2>&1 &
          review_pid=$!
          trap "kill $review_pid" EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18766/api/wearables/cases > /dev/null; then break; fi
            sleep 1
          done
          WEARABLE_BASE_URL=http://127.0.0.1:18766 node tests/wearable-browser.cjs
