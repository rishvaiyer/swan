[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swan-wearable-security"
version = "0.2.0"
description = "Offline metadata trace auditing for wearable-assistant security reviews"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
review = ["fastapi==0.156.4", "uvicorn==0.54.0"]
test = ["pytest>=8,<10", "httpx==0.28.1", "jsonschema>=4,<5"]

[project.scripts]
swan-audit = "app.wearable_cli:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
